[project]
name = "mlops-ai-systems-engineering"
version = "0.1.0"
description = "1413211011 - MLOps and AI Systems Engineering course material"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "codespell<=2.4.1",
  "invoke<=2.2",
  "mkdocs-exclude<=1.0.2",
  "mkdocs-git-revision-date-localized-plugin<=1.4.5",
  "mkdocs-glightbox<=0.4",
  "mkdocs-material<=9.7",
  "mkdocs-material-extensions<=1.3.1",
  "mkdocs-redirects<=1.2.2",
  "mkdocs-same-dir<=0.1.3",
  "pre-commit<=4.1",
  "pymdown-extensions<=10.14.3",
  "ruff<=0.14.5",
]

# Tools used across the module exercises. Grows as each module's exercises are written -
# add the specific SDK a module needs when that module's content is filled in.
[dependency-groups]
exercises = [
  # M1 Development environment
  "python-dotenv<=1.2",
  "nbconvert<=7.16",
  # M2 Organisation and version control
  "cookiecutter<=2.6",
  "dvc<=3.64",
  "typer<=0.19",
  "mypy<=2.3.1",
  # M3 Reproducibility (Docker itself is installed separately, not a Python package)
  "hydra-core<=1.4",
  "omegaconf<=2.4",
  # M4 Debugging, profiling and logging
  "wandb<=0.23",
  # M5 Continuous integration
  "pytest<=8.4.2",
  "coverage<=7.11.3",
  # M6 The cloud (Python-side SDK only, gcloud CLI installed separately)
  "google-cloud-storage<=3.4",
  "google-cloud-aiplatform<=1.128",
  # M7 Deployment
  "fastapi<=0.121.2",
  "uvicorn<=0.38",
  "onnx<=1.19",
  "onnxruntime<=1.23",
  "streamlit<=1.51",
  "locust<=2.42",
  # M8 Monitoring
  "evidently<=0.7.16",
  "prometheus-fastapi-instrumentator<=7.1",
  # M10 Extra
  "mkdocstrings[python]<=0.31",
  "optuna<=4.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.codespell]
skip = "*.pdf,*.ipynb,*.drawio"
