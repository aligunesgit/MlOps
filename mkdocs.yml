site_name: MLOps and AI Systems Engineering
docs_dir: .
site_dir: ../site
repo_url: https://github.com/aligunesgit/MlOps
edit_uri: edit/main/
copyright: Copyright &copy; 2026

theme:
  language: en
  name: material
  logo: figures/mlops_diagram.png
  favicon: figures/mlops_diagram.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - scheme: default
      primary: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - exclude:
      glob:
        - .venv/**
        - site/**
        - vendor/**
        - reference/**
        - CURRICULUM_DRAFT.md
        - reports/README.md
  - glightbox
  - same-dir
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - redirects:
      redirect_maps:
        m1_mlops_introduction/README.md: m1_development_environment/README.md
        m2_ml_and_mlops_stages/README.md: m2_version_control/README.md
        m3_git_essentials/README.md: m3_reproducibility/README.md
        m4_cicd_strategies/README.md: m4_debugging_profiling_logging/README.md
        m5_docker_and_kubernetes/README.md: m5_continuous_integration/README.md
        m6_feature_store/README.md: m6_the_cloud/README.md
        m7_cloud_mlops_deep_dive/README.md: m7_deployment/README.md
        m8_llmops/README.md: m8_monitoring/README.md
        m9_model_monitoring/README.md: m9_scalable_applications/README.md
        m10_automl_tools/README.md: m10_extra/README.md

nav:
  - Home: README.md
  - Introduction: pages/before.md
  - 💻 M1 - Development Environment: m1_development_environment/README.md
  - 📁 M2 - Organisation and Version Control: m2_version_control/README.md
  - ♻️ M3 - Reproducibility: m3_reproducibility/README.md
  - ⏱️ M4 - Debugging, Profiling and Logging: m4_debugging_profiling_logging/README.md
  - ✔️ M5 - Continuous Integration: m5_continuous_integration/README.md
  - 🚀 Project Sprint A: sprint_a_project/README.md
  - 🌐 M6 - The Cloud: m6_the_cloud/README.md
  - 📦 M7 - Deployment: m7_deployment/README.md
  - 📊 M8 - Monitoring: m8_monitoring/README.md
  - ⚖️ M9 - Scalable Applications: m9_scalable_applications/README.md
  - 🔥 M10 - Extra: m10_extra/README.md
  - 🏁 Project Sprint B: sprint_b_final_project/README.md
  - Time plan: pages/timeplan.md
  - Projects: pages/projects.md
  - FAQ: pages/faq.md
  - Summary: pages/overview.md
  - Slides: slides/module-1-development-environment.pdf
